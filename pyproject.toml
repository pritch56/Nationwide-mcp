[project]
name = "nationwide-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for Nationwide Building Society (UK) account data via TrueLayer, Lunch Flow, Enable Banking or statement files"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pritch56" }]
keywords = ["mcp", "model-context-protocol", "nationwide", "open-banking", "truelayer", "banking", "uk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "anyio>=4.5",
    "httpx>=0.28.1",
    "mcp>=2.3,<3",
    "pyjwt[crypto]>=2.15.1",
    "starlette>=0.40",
    "tzdata>=2024.1",
    "uvicorn>=0.34",
]

[project.urls]
Homepage = "https://github.com/pritch56/Nationwide-mcp"
Repository = "https://github.com/pritch56/Nationwide-mcp"
Issues = "https://github.com/pritch56/Nationwide-mcp/issues"
Changelog = "https://github.com/pritch56/Nationwide-mcp/blob/main/CHANGELOG.md"

[project.scripts]
nationwide-mcp = "nationwide_mcp.server:main"
nationwide-mcp-link = "nationwide_mcp.link:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nationwide_mcp"]

[dependency-groups]
dev = [
    "cryptography>=43",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--basetemp=.pytest_tmp -p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/test_statement.py" = ["E501"]  # fixture data
